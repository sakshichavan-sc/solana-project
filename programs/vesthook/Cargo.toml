[package]
name = "vesthook"
version = "0.1.0"
description = "Token-2022 transfer-hook vesting enforcement"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vesthook"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", features = ["token_2022"] }
spl-transfer-hook-interface = "=0.9.0"
spl-tlv-account-resolution = "=0.9.0"
spl-token-2022 = "=6.0.0"
spl-pod = "=0.5.0"
